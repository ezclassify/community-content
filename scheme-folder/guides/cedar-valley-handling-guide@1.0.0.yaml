guide:
  id: cedar-valley-handling-guide
  version: 1.0.0
  name: "Cedar Valley: Protection and Handling Guide"
  description: >-
    Suggests a protection level and any applicable human handling instructions. The host application
    remains responsible for identity, authorization, and completion of the instructed action.
  targetSchemes:
    - id: cedar-valley-handling
      version: "*"
  categories:
    - id: protection
      label: 1. Protection
    - id: handling
      label: 2. Handling instructions
  rules:
    inline:
      - id: public
        name: Public
        category: protection
        keywords:
          - published lunch menu
          - school calendar
          - released practice questions
          - approved for public release
        outcome:
          concepts:
            - id: PUBLIC
              category: level
        rationale: Public is a positive approval for this exact version; an unmarked file is not public.
      - id: internal
        name: Internal
        category: protection
        keywords:
          - staff plan
          - district memo
          - routine operations
          - bus operations schedule
        outcome:
          concepts:
            - id: INTERNAL
              category: level
        rationale: Routine district work that has not been approved for public distribution is Internal.
      - id: confidential
        name: Confidential
        category: protection
        keywords:
          - student record
          - employee evaluation
          - supplier bid
          - purchasing notes
        outcome:
          concepts:
            - id: CONFIDENTIAL
              category: level
        rationale: >-
          Private records and active purchasing material need confirmed record or business
          authorization from the host.
      - id: restricted
        name: Restricted
        category: protection
        keywords:
          - live assessment
          - answer key
          - building access code
          - active investigation
        outcome:
          concepts:
            - id: RESTRICTED
              category: level
        rationale: >-
          Safety, investigation, and live-assessment material needs explicit assignment from the
          host.
      - id: do-not-forward
        name: Do not forward
        category: handling
        keywords:
          - do not forward
          - ask before sharing
        outcome:
          concepts:
            - id: DO_NOT_FORWARD
              category: handling
        rationale: This is a human instruction; the marking does not technically block forwarding.
      - id: redact-before-release
        name: Redact before release
        category: handling
        keywords:
          - redact before release
          - public copy
        outcome:
          concepts:
            - id: REDACT_BEFORE_RELEASE
              category: handling
        rationale: Create and approve a separate redacted public version; this copy remains protected.
      - id: keep-sealed
        name: Keep sealed
        category: handling
        keywords:
          - keep sealed
          - open at scheduled time
        outcome:
          concepts:
            - id: KEEP_SEALED
              category: handling
        rationale: The custodian controls the opening event outside the marking engine.
      - id: collect-after-use
        name: Collect after use
        category: handling
        keywords:
          - collect after use
          - return every copy
        outcome:
          concepts:
            - id: COLLECT_AFTER_USE
              category: handling
        rationale: The custodian records collection outside the marking engine.
