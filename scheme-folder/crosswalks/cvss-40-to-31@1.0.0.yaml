  selections:
    # Cross-field decisions from the FIRST rubric.
    - id: derive-attack-complexity
      strategy: first-match
      candidates:
        - id: high
          when:
            any:
              - categoryId: attack_complexity
                conceptId: AC_H
              - categoryId: attack_requirements
                conceptId: AT_P
          sources:
            - categoryId: attack_complexity
              conceptId: AC_L
            - categoryId: attack_complexity
              conceptId: AC_H
            - categoryId: attack_requirements
              conceptId: AT_N
            - categoryId: attack_requirements
              conceptId: AT_P
          targets:
            - categoryId: attack_complexity
              conceptId: AC_H
          reason: CVSS 3.1 Attack Complexity is High when v4.0 AC is High or Attack Requirements is Present.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
        - id: low
          sources:
            - categoryId: attack_complexity
              conceptId: AC_L
            - categoryId: attack_complexity
              conceptId: AC_H
            - categoryId: attack_requirements
              conceptId: AT_N
            - categoryId: attack_requirements
              conceptId: AT_P
          targets:
            - categoryId: attack_complexity
              conceptId: AC_L
          reason: With Low v4.0 AC and no Attack Requirements, CVSS 3.1 Attack Complexity remains Low.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
    - id: derive-scope
      strategy: first-match
      candidates:
        - id: changed
          when:
            any:
              - categoryId: sc_impact
                conceptId: SC_L
              - categoryId: sc_impact
                conceptId: SC_H
              - categoryId: si_impact
                conceptId: SI_L
              - categoryId: si_impact
                conceptId: SI_H
              - categoryId: sa_impact
                conceptId: SA_L
              - categoryId: sa_impact
                conceptId: SA_H
          targets:
            - categoryId: scope
              conceptId: S_C
          reason: Any non-None subsequent-system impact derives CVSS 3.1 Scope:Changed.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
        - id: unchanged
          targets:
            - categoryId: scope
              conceptId: S_U
          reason: With no subsequent-system impact, CVSS 3.1 Scope is Unchanged.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
