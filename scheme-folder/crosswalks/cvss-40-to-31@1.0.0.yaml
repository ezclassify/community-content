  selections:
    # Cross-field decisions from the FIRST rubric.
    - id: derive-attack-complexity
      strategy: first-match
      candidates:
        - id: high
          when:
            any:
              - category: attack_complexity
                concept: AC_H
              - category: attack_requirements
                concept: AT_P
          sources:
            - category: attack_complexity
              concept: AC_L
            - category: attack_complexity
              concept: AC_H
            - category: attack_requirements
              concept: AT_N
            - category: attack_requirements
              concept: AT_P
          targets:
            - category: attack_complexity
              concept: AC_H
          reason: CVSS 3.1 Attack Complexity is High when v4.0 AC is High or Attack Requirements is Present.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
        - id: low
          sources:
            - category: attack_complexity
              concept: AC_L
            - category: attack_complexity
              concept: AC_H
            - category: attack_requirements
              concept: AT_N
            - category: attack_requirements
              concept: AT_P
          targets:
            - category: attack_complexity
              concept: AC_L
          reason: With Low v4.0 AC and no Attack Requirements, CVSS 3.1 Attack Complexity remains Low.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
    - id: derive-scope
      strategy: first-match
      candidates:
        - id: changed
          when:
            any:
              - category: sc_impact
                concept: SC_L
              - category: sc_impact
                concept: SC_H
              - category: si_impact
                concept: SI_L
              - category: si_impact
                concept: SI_H
              - category: sa_impact
                concept: SA_L
              - category: sa_impact
                concept: SA_H
          targets:
            - category: scope
              concept: S_C
          reason: Any non-None subsequent-system impact derives CVSS 3.1 Scope:Changed.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
        - id: unchanged
          targets:
            - category: scope
              concept: S_U
          reason: With no subsequent-system impact, CVSS 3.1 Scope is Unchanged.
          authority: FIRST CVSS SIG conversion rubric
          citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
