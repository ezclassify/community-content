# CVSS 4.0 to CVSS 3.1, derived with the conversion rubric FIRST publishes in its CVSS FAQ
# (https://www.first.org/cvss/faq). This file applies that rubric to EzClassify crosswalk
# mappings and selections. It is not an official FIRST crosswalk, and FIRST does not
# review or publish it.
#
# A complete 4.0 Base vector translates to a complete 3.1 Base vector, plus Exploit Code
# Maturity when the 4.0 vector carries Exploit Maturity. The rubric works across fields,
# so three selections do the cross-field work: Attack Requirements folds into Attack
# Complexity, Scope comes from subsequent-system impact, and one impact domain, vulnerable
# system or subsequent system, becomes the 3.1 Confidentiality, Integrity and Availability
# set. The 4.0 Supplemental metrics have no 3.1 field and come back as omissions.
#
# The rubric reads no 4.0 Environmental metric, so the Security Requirements, the Modified
# Base metrics and every explicit Not Defined (X) value come back as omissions too. Only
# the qualitative severity rating has no rule; it comes back unmapped, which makes the
# translation partial.
crosswalk:
  id: cvss-40-to-31
  version: 1.0.0
  name: CVSS 4.0 to 3.1 FIRST-aligned derivation
  description: Derive a complete CVSS 3.1 Base vector from the clearer CVSS 4.0 assessment data.
  guidance: >-
    Apply FIRST’s published rubric programmatically: fold Attack Requirements into Attack Complexity, derive Scope from subsequent-system impact, and select one complete impact domain.
  citation: https://www.first.org/cvss/faq#How-can-CVSS-v31-vectors-be-derived-from-v40-vectors
  source_scheme:
    id: cvss-v4
    version: 4.0.0
  target_scheme:
    id: cvss
    version: 3.1.0
