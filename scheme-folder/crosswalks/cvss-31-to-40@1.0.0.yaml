          conceptId: E_A
      disposition: review
      reason: >-
        CVSS 4.0 Attacked uses observed attack or exploitation-enablement criteria that a 3.1 High value alone
        does not prove.
      authority: https://www.first.org/cvss/v4.0/specification-document
