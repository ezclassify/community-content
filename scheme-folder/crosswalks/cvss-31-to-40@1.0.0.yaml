    # 3.1 High complexity covers what 4.0 splits into Attack Complexity and
    # Attack Requirements.
    - id: review-attack_complexity-AC_H
      source:
        categoryId: attack_complexity
        conceptId: AC_H
      disposition: review
      reason: >-
        CVSS 3.1 High complexity combines conditions that CVSS 4.0 separates into Attack Complexity and Attack
        Requirements. Reassess both metrics.
      authority: EzClassify community migration policy
      guidance: A qualified analyst must choose the v4.0 value from current vulnerability evidence.
      citation: https://www.first.org/cvss/v4.0/
