# CVSS 3.1 to CVSS 4.0: a reviewed migration aid, partial on purpose.
#
# It carries only the metrics whose values CVSS 4.0 keeps unchanged: Attack Vector,
# Privileges Required, Low Attack Complexity, no User Interaction and Proof-of-Concept
# exploit maturity. Every metric that 4.0 split, renamed or redefined comes back as a
# review outcome for an analyst, and the Temporal metrics 4.0 retired come back as
# omissions. A translation through this file never produces a scorable v4.0 vector on
# its own. Keep the 3.1 source vector and finish the review before scoring.
#
# EzClassify community content maintains this file. It follows the CVSS 4.0
# specification and FIRST’s summary of what changed, and it is not an official FIRST
# crosswalk.
crosswalk:
  id: cvss-31-to-40
  version: 1.0.0
  name: CVSS 3.1 to 4.0 reviewed migration aid
  description: Carry unchanged exploitability values and expose every changed, retired, or unresolved metric.
  guidance: Preserve the 3.1 source and require an analyst to complete every review outcome before scoring v4.0.
  citation: https://www.first.org/cvss/v4.0/
  source_scheme:
    id: cvss
    version: 3.1.0
  target_scheme:
    id: cvss-v4
    version: 4.0.0
  mappings:
