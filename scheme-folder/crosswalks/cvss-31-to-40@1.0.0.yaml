          conceptId: E_P
        - categoryId: exploit_maturity
          conceptId: E_A
      disposition: review
      reason: CVSS 4.0 replaces Functional with evidence-based Proof-of-Concept or Attacked choices.
      authority: https://www.first.org/cvss/v4.0/specification-document
    - id: review-exploit-maturity-high
