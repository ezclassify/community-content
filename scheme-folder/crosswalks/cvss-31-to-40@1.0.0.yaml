        conceptId: E_U
      targets:
        - categoryId: exploit_maturity
          conceptId: E_U
      disposition: review
      reason: >-
        The U code changes from Unproven in 3.1 to Unreported in 4.0 and must be checked against the newer
        criteria.
      authority: https://www.first.org/cvss/v4.0/specification-document
    - id: review-exploit-maturity-functional
      source:
