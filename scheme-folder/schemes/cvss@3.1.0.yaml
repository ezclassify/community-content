scheme:
    id: cvss
    version: 3.1.0
    name: CVSS v3.1
    description: >
        Common Vulnerability Scoring System (CVSS) v3.1 Base, Temporal, and Environmental Metrics as defined by FIRST.org.
        Encodes the full CVSS vector string including optional Temporal and Environmental metric groups.
    guidance: >-
        The vector string is the transport form of an assessment: one value per metric, in a fixed order, short enough to paste
        into a ticket and machine readable on the other end. Source: FIRST CVSS v3.1 Specification Document,
        https://www.first.org/cvss/v3.1/specification-document.
    data:
        categories:
            - id: attack_vector
              label: Attack Vector (AV)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.1.1, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 0
            - id: attack_complexity
              label: Attack Complexity (AC)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.1.2, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 1
            - id: privileges_required
              label: Privileges Required (PR)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.1.3, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 2
            - id: user_interaction
              label: User Interaction (UI)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.1.4, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 3
            - id: scope
              label: Scope (S)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.2, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 4
            - id: confidentiality
              label: Confidentiality Impact (C)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.3.1, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 5
            - id: integrity
              label: Integrity Impact (I)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.3.2, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 6
            - id: availability
              label: Availability Impact (A)
              citation: FIRST CVSS v3.1 Specification Document, Section 2.3.3, https://www.first.org/cvss/v3.1/specification-document
              required: true
              single: true
              rollup: max
              position: 7
            - id: exploit_code_maturity
              label: Exploit Code Maturity (E)
              citation: FIRST CVSS v3.1 Specification Document, Section 3.1, https://www.first.org/cvss/v3.1/specification-document
              required: false
              single: true
              rollup: max
              position: 8
            - id: remediation_level
              label: Remediation Level (RL)
              citation: FIRST CVSS v3.1 Specification Document, Section 3.2, https://www.first.org/cvss/v3.1/specification-document
              required: false
              single: true
              rollup: max
              position: 9
            - id: report_confidence
              label: Report Confidence (RC)
              citation: FIRST CVSS v3.1 Specification Document, Section 3.3, https://www.first.org/cvss/v3.1/specification-document
              required: false
              single: true
              rollup: max
              position: 10
            - id: confidentiality_requirement
              label: Confidentiality Requirement (CR)
              citation: FIRST CVSS v3.1 Specification Document, Section 4.1, https://www.first.org/cvss/v3.1/specification-document
              required: false
              single: true
              rollup: max
              position: 11
            - id: integrity_requirement
              label: Integrity Requirement (IR)
              citation: FIRST CVSS v3.1 Specification Document, Section 4.2, https://www.first.org/cvss/v3.1/specification-document
              required: false
              single: true
              rollup: max
              position: 12
            - id: availability_requirement
              label: Availability Requirement (AR)
              citation: FIRST CVSS v3.1 Specification Document, Section 4.3, https://www.first.org/cvss/v3.1/specification-document
              required: false
              single: true
              rollup: max
              position: 13
        concepts:
            inline:
                - id: AV_N
                  name: 'Attack Vector: Network'
                  views:
                      default: 'AV:N'
                      metric: 'N'
                  categories:
                      - attack_vector
                  position: 3
                  rank: 3
                - id: AV_A
                  name: 'Attack Vector: Adjacent'
                  views:
                      default: 'AV:A'
                      metric: A
                  categories:
                      - attack_vector
                  position: 2
                  rank: 2
                - id: AV_L
                  name: 'Attack Vector: Local'
                  views:
                      default: 'AV:L'
                      metric: L
                  categories:
                      - attack_vector
                  position: 1
                  rank: 1
                - id: AV_P
                  name: 'Attack Vector: Physical'
                  views:
                      default: 'AV:P'
                      metric: P
                  categories:
                      - attack_vector
                  position: 0
                  rank: 0
                - id: AC_L
                  name: 'Attack Complexity: Low'
                  views:
                      default: 'AC:L'
                      metric: L
                  categories:
                      - attack_complexity
                  position: 1
                  rank: 1
                - id: AC_H
                  name: 'Attack Complexity: High'
                  views:
                      default: 'AC:H'
                      metric: H
                  categories:
                      - attack_complexity
                  position: 0
                  rank: 0
                - id: PR_N
                  name: 'Privileges Required: None'
                  views:
                      default: 'PR:N'
                      metric: 'N'
                  categories:
                      - privileges_required
                  position: 2
                  rank: 2
                - id: PR_L
                  name: 'Privileges Required: Low'
                  views:
                      default: 'PR:L'
                      metric: L
                  categories:
                      - privileges_required
                  position: 1
                  rank: 1
                - id: PR_H
                  name: 'Privileges Required: High'
                  views:
                      default: 'PR:H'
                      metric: H
                  categories:
                      - privileges_required
                  position: 0
                  rank: 0
                - id: UI_N
                  name: 'User Interaction: None'
                  views:
                      default: 'UI:N'
                      metric: 'N'
                  categories:
                      - user_interaction
                  position: 1
                  rank: 1
                - id: UI_R
                  name: 'User Interaction: Required'
                  views:
                      default: 'UI:R'
                      metric: R
                  categories:
                      - user_interaction
                  position: 0
                  rank: 0
                - id: S_U
                  name: 'Scope: Unchanged'
                  views:
                      default: 'S:U'
                      metric: U
                  categories:
                      - scope
                  position: 0
                  rank: 0
                - id: S_C
                  name: 'Scope: Changed'
                  views:
