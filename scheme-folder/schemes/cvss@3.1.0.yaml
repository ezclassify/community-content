                      metric: 'N'
                  categories:
                      - confidentiality
                  position: 0
                  rank: 0
                - id: C_L
                  name: 'Confidentiality Impact: Low'
                  views:
                      default: 'C:L'
                      metric: L
                  categories:
                      - confidentiality
                  position: 1
                  rank: 1
                - id: C_H
                  name: 'Confidentiality Impact: High'
                  views:
                      default: 'C:H'
                      metric: H
                  categories:
                      - confidentiality
                  position: 2
                  rank: 2
                - id: I_N
                  name: 'Integrity Impact: None'
                  views:
                      default: 'I:N'
                      metric: 'N'
                  categories:
                      - integrity
                  position: 0
                  rank: 0
                - id: I_L
                  name: 'Integrity Impact: Low'
                  views:
                      default: 'I:L'
                      metric: L
                  categories:
                      - integrity
                  position: 1
                  rank: 1
                - id: I_H
                  name: 'Integrity Impact: High'
                  views:
                      default: 'I:H'
                      metric: H
                  categories:
                      - integrity
                  position: 2
                  rank: 2
                - id: A_N
                  name: 'Availability Impact: None'
                  views:
                      default: 'A:N'
                      metric: 'N'
                  categories:
                      - availability
                  position: 0
                  rank: 0
                - id: A_L
                  name: 'Availability Impact: Low'
                  views:
                      default: 'A:L'
                      metric: L
                  categories:
                      - availability
                  position: 1
                  rank: 1
                - id: A_H
                  name: 'Availability Impact: High'
                  views:
                      default: 'A:H'
                      metric: H
                  categories:
                      - availability
                  position: 2
                  rank: 2
                - id: E_X
                  name: 'Exploit Code Maturity: Not Defined'
                  views:
                      default: 'E:X'
                      metric: X
                  categories:
                      - exploit_code_maturity
                  position: 0
                  rank: 5
                - id: E_U
                  name: 'Exploit Code Maturity: Unproven'
                  views:
                      default: 'E:U'
                      metric: U
                  categories:
