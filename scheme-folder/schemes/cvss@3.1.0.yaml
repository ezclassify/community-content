                  rank: 4
                - id: RL_X
                  name: 'Remediation Level: Not Defined'
                  views:
                      default: 'RL:X'
                      metric: X
                  categories:
                      - remediation_level
                  position: 0
                  rank: 5
                - id: RL_O
                  name: 'Remediation Level: Official Fix'
                  views:
                      default: 'RL:O'
                      metric: O
                  categories:
                      - remediation_level
                  position: 1
                  rank: 1
                - id: RL_T
                  name: 'Remediation Level: Temporary Fix'
                  views:
                      default: 'RL:T'
                      metric: T
                  categories:
                      - remediation_level
                  position: 2
                  rank: 2
                - id: RL_W
                  name: 'Remediation Level: Workaround'
                  views:
