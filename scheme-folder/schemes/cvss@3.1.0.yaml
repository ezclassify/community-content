                - id: CR_M
                  name: 'Confidentiality Requirement: Medium'
                  views:
                      default: 'CR:M'
                      metric: M
                  categories:
                      - confidentiality_requirement
                  position: 2
                  rank: 3
                - id: CR_H
                  name: 'Confidentiality Requirement: High'
                  views:
                      default: 'CR:H'
                      metric: H
                  categories:
                      - confidentiality_requirement
                  position: 3
                  rank: 4
                - id: IR_X
                  name: 'Integrity Requirement: Not Defined'
                  views:
                      default: 'IR:X'
                      metric: X
                  categories:
                      - integrity_requirement
                  position: 0
                  rank: 2
                - id: IR_L
                  name: 'Integrity Requirement: Low'
                  views:
                      default: 'IR:L'
                      metric: L
                  categories:
                      - integrity_requirement
                  position: 1
                  rank: 1
                - id: IR_M
                  name: 'Integrity Requirement: Medium'
                  views:
                      default: 'IR:M'
                      metric: M
                  categories:
                      - integrity_requirement
                  position: 2
                  rank: 3
                - id: IR_H
                  name: 'Integrity Requirement: High'
                  views:
                      default: 'IR:H'
                      metric: H
                  categories:
                      - integrity_requirement
                  position: 3
                  rank: 4
                - id: AR_X
                  name: 'Availability Requirement: Not Defined'
                  views:
                      default: 'AR:X'
                      metric: X
                  categories:
                      - availability_requirement
                  position: 0
                  rank: 2
                - id: AR_L
                  name: 'Availability Requirement: Low'
                  views:
                      default: 'AR:L'
                      metric: L
                  categories:
                      - availability_requirement
                  position: 1
                  rank: 1
                - id: AR_M
                  name: 'Availability Requirement: Medium'
                  views:
                      default: 'AR:M'
                      metric: M
                  categories:
                      - availability_requirement
                  position: 2
                  rank: 3
                - id: AR_H
                  name: 'Availability Requirement: High'
                  views:
                      default: 'AR:H'
                      metric: H
                  categories:
                      - availability_requirement
                  position: 3
                  rank: 4
    rules:
        - id: exclusive-av
          action: exclusive
          message: Only one Attack Vector value may be specified
          target:
              - AV_N
              - AV_A
              - AV_L
              - AV_P
        - id: exclusive-ac
          action: exclusive
          message: Only one Attack Complexity value may be specified
          target:
              - AC_L
              - AC_H
        - id: exclusive-pr
          action: exclusive
          message: Only one Privileges Required value may be specified
          target:
              - PR_N
              - PR_L
              - PR_H
        - id: exclusive-ui
          action: exclusive
          message: Only one User Interaction value may be specified
          target:
              - UI_N
              - UI_R
        - id: exclusive-s
          action: exclusive
          message: Only one Scope value may be specified
          target:
              - S_U
              - S_C
        - id: exclusive-c
          action: exclusive
          message: Only one Confidentiality Impact value may be specified
          target:
              - C_N
              - C_L
              - C_H
        - id: exclusive-i
          action: exclusive
          message: Only one Integrity Impact value may be specified
          target:
              - I_N
              - I_L
              - I_H
        - id: exclusive-a
          action: exclusive
          message: Only one Availability Impact value may be specified
          target:
              - A_N
              - A_L
              - A_H
        - id: exclusive-e
          action: exclusive
          message: Only one Exploit Code Maturity value may be specified
          target:
              - E_X
              - E_U
              - E_P
              - E_F
              - E_H
        - id: exclusive-rl
          action: exclusive
          message: Only one Remediation Level value may be specified
          target:
              - RL_X
              - RL_O
              - RL_T
              - RL_W
              - RL_U
        - id: exclusive-rc
          action: exclusive
          message: Only one Report Confidence value may be specified
          target:
              - RC_X
              - RC_U
              - RC_R
              - RC_C
        - id: exclusive-cr
          action: exclusive
          message: Only one Confidentiality Requirement value may be specified
          target:
              - CR_X
              - CR_L
              - CR_M
              - CR_H
        - id: exclusive-ir
          action: exclusive
          message: Only one Integrity Requirement value may be specified
          target:
              - IR_X
              - IR_L
              - IR_M
              - IR_H
        - id: exclusive-ar
          action: exclusive
          message: Only one Availability Requirement value may be specified
          target:
              - AR_X
              - AR_L
              - AR_M
              - AR_H
    parse:
        case_sensitive: false
        strip_whitespace: true
        normalize:
            - id: fix-case
              type: case
              description: CVSS metric values are uppercase
              correction: upper
              confidence: safe
              explanation: Converted metric value to uppercase
              pattern: '(av|ac|pr|ui|s|c|i|a|e|rl|rc|cr|ir|ar):[a-z]'
            - id: fix-redundant
              type: dedup
              description: Remove duplicate metric values
              confidence: safe
              explanation: Removed duplicate metric value
    render:
        default: vector
        formats:
            - id: vector
              view: default
              surface: default
              mode: inline
              prefix: 'CVSS:3.1/'
              separator: /
              fields:
                  - category: attack_vector
                  - category: attack_complexity
                  - category: privileges_required
                  - category: user_interaction
                  - category: scope
                  - category: confidentiality
                  - category: integrity
                  - category: availability
                  - category: exploit_code_maturity
                  - category: remediation_level
                  - category: report_confidence
                  - category: confidentiality_requirement
                  - category: integrity_requirement
                  - category: availability_requirement
    default_scope: default
    scopes:
        - id: default
          label: Default
