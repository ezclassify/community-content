        concepts:
            inline:
                - id: AV_N
                  name: 'Attack Vector: Network'
                  definition: >-
                      Reachable through the network stack, so the set of possible attackers is not bounded by proximity and can extend
                      to the whole internet.
                  guidance: 'Select when the vulnerability is exploitable over the network, such as remotely exploitable web application flaws.'
                  views:
                      default: 'AV:N'
                      metric: 'N'
                      label: Network
                  aliases:
                      - 'AV:N'
                      - AV N
                      - Attack Vector Network
                  categories:
                      - attack_vector
                  position: 3
                  rank: 3
                - id: AV_A
                  name: 'Attack Vector: Adjacent'
                  definition: >-
                      Reachable only over a protocol whose reach is a logically adjacent topology, such as a shared link layer or one
                      IP subnet.
                  guidance: >-
                      Select when the attack is limited to the same shared physical or logical network, such as Bluetooth, IEEE 802.11,
                      or a local IP subnet.
                  views:
                      default: 'AV:A'
                      metric: A
                      label: Adjacent
                  aliases:
                      - 'AV:A'
                      - AV A
                      - Attack Vector Adjacent
                  categories:
                      - attack_vector
                  position: 2
                  rank: 2
                - id: AV_L
                  name: 'Attack Vector: Local'
                  definition: >-
                      Not reachable over the network stack. The attacker works through local read, write, or execute access, or through
                      a person acting on the system.
                  guidance: >-
                      Select when the vulnerability requires the attacker to have local system access, such as a local privilege
                      escalation.
                  views:
                      default: 'AV:L'
                      metric: L
                      label: Local
                  aliases:
                      - 'AV:L'
                      - AV L
                      - Attack Vector Local
                  categories:
                      - attack_vector
                  position: 1
                  rank: 1
                - id: AV_P
                  name: 'Attack Vector: Physical'
                  definition: >-
                      The attacker has to touch or handle the system, so physical access to the hardware is a precondition.
                  guidance: 'Select when the vulnerability requires physical access to the hardware, such as a cold boot attack.'
                  views:
                      default: 'AV:P'
                      metric: P
                      label: Physical
                  aliases:
                      - 'AV:P'
                      - AV P
                      - Attack Vector Physical
                  categories:
                      - attack_vector
                  position: 0
                  rank: 0
                - id: AC_L
                  name: 'Attack Complexity: Low'
                  definition: >-
                      No measurable extra work is needed beyond reaching the system to obtain a working exploit.
                  guidance: >-
                      Select when no specialized access conditions or extenuating circumstances exist; the attack can be reliably
                      reproduced at will.
                  views:
                      default: 'AC:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'AC:L'
                      - AC L
                  categories:
                      - attack_complexity
                  position: 1
                  rank: 1
                - id: AC_H
                  name: 'Attack Complexity: High'
                  definition: >-
                      A working exploit depends on evading or defeating a hardening measure that would otherwise block the attack.
                  guidance: >-
                      Select when the attack requires the attacker to invest measurable effort in preparation or execution against the
                      specific target, such as winning a race condition or performing target-specific reconnaissance.
                  views:
                      default: 'AC:H'
                      metric: H
                      label: High
                  aliases:
                      - 'AC:H'
                      - AC H
                  categories:
                      - attack_complexity
                  position: 0
                  rank: 0
                - id: AT_N
                  name: 'Attack Requirements: None'
                  definition: >-
                      Exploitation does not depend on how the target happens to be deployed or configured.
                  guidance: 'Select when the attack can succeed regardless of configuration, environment, or timing conditions of the target.'
                  views:
                      default: 'AT:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'AT:N'
                      - AT N
                  categories:
                      - attack_requirements
                  position: 1
                  rank: 1
                - id: AT_P
                  name: 'Attack Requirements: Present'
                  definition: >-
                      Exploitation depends on particular deployment or execution conditions being present on the target.
                  guidance: >-
                      Select when the attack requires a specific configuration, race condition, or non-default setting to be present on
                      the target system.
                  views:
                      default: 'AT:P'
                      metric: P
                      label: Present
                  aliases:
                      - 'AT:P'
                      - AT P
                  categories:
                      - attack_requirements
                  position: 0
                  rank: 0
                - id: PR_N
                  name: 'Privileges Required: None'
                  definition: >-
                      The attacker holds no authorization before the attack and needs no access to the target's settings or files.
                  guidance: Select when the attack can be performed without any prior authentication or authorization to the target system.
                  views:
                      default: 'PR:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'PR:N'
                      - PR N
                  categories:
                      - privileges_required
                  position: 2
                  rank: 2
                - id: PR_L
                  name: 'Privileges Required: Low'
                  definition: >-
                      The attacker needs the privileges of an ordinary authorized user.
                  guidance: >-
                      Select when the attacker needs basic user-level access, such as a standard authenticated account on the target
                      system.
                  views:
                      default: 'PR:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'PR:L'
                      - PR L
                  categories:
                      - privileges_required
                  position: 1
                  rank: 1
                - id: PR_H
                  name: 'Privileges Required: High'
                  definition: >-
                      The attacker needs privileges that carry broad control over the target, such as an administrative account with
                      full access to its settings and files.
                  guidance: >-
                      Select when the attacker needs administrative or highly privileged access to the target system before the attack
                      can succeed.
                  views:
                      default: 'PR:H'
                      metric: H
                      label: High
                  aliases:
                      - 'PR:H'
                      - PR H
                  categories:
                      - privileges_required
                  position: 0
                  rank: 0
                - id: UI_N
                  name: 'User Interaction: None'
                  definition: >-
                      No person other than the attacker has to do anything.
                  guidance: Select when no action is required from any user (other than the attacker) for the vulnerability to be exploited.
                  views:
                      default: 'UI:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'UI:N'
                      - UI N
                  categories:
                      - user_interaction
                  position: 2
                  rank: 2
                - id: UI_P
                  name: 'User Interaction: Passive'
                  definition: >-
                      Exploitation needs limited involvement from the targeted user, short of a deliberate action aimed at the
                      attacker's payload.
                  guidance: >-
                      Select when the user unknowingly enables the attack through ordinary use, such as visiting a web page that
                      silently triggers the exploit.
                  views:
                      default: 'UI:P'
                      metric: P
                      label: Passive
                  aliases:
                      - 'UI:P'
                      - UI P
                  categories:
                      - user_interaction
                  position: 1
                  rank: 1
                - id: UI_A
                  name: 'User Interaction: Active'
                  definition: >-
                      Exploitation needs the targeted user to take specific, deliberate actions, or to work around a protection
                      mechanism.
                  guidance: >-
                      Select when the user must take deliberate action for exploitation to succeed, such as importing a malicious file,
                      accepting a security warning, or manually installing software.
                  views:
                      default: 'UI:A'
                      metric: A
                      label: Active
                  aliases:
                      - 'UI:A'
                      - UI A
                  categories:
                      - user_interaction
                  position: 0
                  rank: 0
                - id: VC_H
                  name: 'Vulnerable System Confidentiality: High'
                  definition: >-
                      Confidentiality on the vulnerable system is lost entirely: all of its information is exposed to the attacker.
                  guidance: >-
                      Select when the attacker can read all data on the vulnerable system, such as full database disclosure or memory
                      dump.
                  views:
                      default: 'VC:H'
                      metric: H
                      label: High
                  aliases:
                      - 'VC:H'
                      - VC H
                  categories:
                      - vc_impact
                  position: 2
                  rank: 2
                - id: VC_L
                  name: 'Vulnerable System Confidentiality: Low'
                  definition: >-
                      Confidentiality on the vulnerable system is partly lost: some restricted information is exposed, but the attacker
                      cannot choose which.
                  guidance: >-
                      Select when the attacker gains access to limited data on the vulnerable system, such as partial information
                      leakage from error messages or side channels.
                  views:
                      default: 'VC:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'VC:L'
                      - VC L
                  categories:
                      - vc_impact
                  position: 1
                  rank: 1
                - id: VC_N
                  name: 'Vulnerable System Confidentiality: None'
                  definition: >-
                      Confidentiality on the vulnerable system is unaffected.
                  guidance: Select when confidentiality of the vulnerable system is not affected by the vulnerability.
                  views:
                      default: 'VC:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'VC:N'
                      - VC N
                  categories:
                      - vc_impact
                  position: 0
                  rank: 0
                - id: VI_H
                  name: 'Vulnerable System Integrity: High'
                  definition: >-
                      Integrity on the vulnerable system is lost entirely: any of its data can be altered.
                  guidance: Select when the attacker can modify all data or files on the vulnerable system without restriction.
                  views:
                      default: 'VI:H'
                      metric: H
                      label: High
                  aliases:
                      - 'VI:H'
                      - VI H
                  categories:
                      - vi_impact
                  position: 2
                  rank: 2
                - id: VI_L
                  name: 'Vulnerable System Integrity: Low'
                  definition: >-
                      Integrity on the vulnerable system is partly lost: data can be altered, but the extent or the effect of the
                      change is outside the attacker's control.
                  guidance: Select when the attacker can make limited or uncontrolled modifications to data on the vulnerable system.
                  views:
                      default: 'VI:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'VI:L'
                      - VI L
                  categories:
                      - vi_impact
                  position: 1
                  rank: 1
                - id: VI_N
                  name: 'Vulnerable System Integrity: None'
                  definition: >-
                      Integrity on the vulnerable system is unaffected.
                  guidance: Select when integrity of the vulnerable system is not affected by the vulnerability.
                  views:
                      default: 'VI:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'VI:N'
                      - VI N
                  categories:
                      - vi_impact
                  position: 0
                  rank: 0
                - id: VA_H
                  name: 'Vulnerable System Availability: High'
                  definition: >-
                      Availability of the vulnerable system is lost entirely: access to its resources can be denied outright.
                  guidance: >-
                      Select when the attacker can completely deny service on the vulnerable system, such as a crash or sustained denial
                      of service.
                  views:
                      default: 'VA:H'
                      metric: H
                      label: High
                  aliases:
                      - 'VA:H'
                      - VA H
                  categories:
                      - va_impact
                  position: 2
                  rank: 2
                - id: VA_L
                  name: 'Vulnerable System Availability: Low'
                  definition: >-
                      Availability of the vulnerable system degrades, through reduced performance or interrupted access to its
                      resources.
                  guidance: >-
                      Select when the attacker can cause degraded performance or intermittent availability issues on the vulnerable
                      system.
                  views:
                      default: 'VA:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'VA:L'
                      - VA L
                  categories:
                      - va_impact
                  position: 1
                  rank: 1
                - id: VA_N
                  name: 'Vulnerable System Availability: None'
                  definition: >-
                      Availability of the vulnerable system is unaffected.
                  guidance: Select when availability of the vulnerable system is not affected by the vulnerability.
                  views:
                      default: 'VA:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'VA:N'
                      - VA N
                  categories:
                      - va_impact
                  position: 0
                  rank: 0
                - id: SC_H
                  name: 'Subsequent System Confidentiality: High'
                  definition: >-
                      Confidentiality on subsequent systems is lost entirely: all of their information is exposed to the attacker.
                  guidance: >-
                      Select when the attacker can read all data on systems beyond the vulnerable system, such as lateral movement
                      leading to full data access on other hosts.
                  views:
                      default: 'SC:H'
                      metric: H
                      label: High
                  aliases:
                      - 'SC:H'
                      - SC H
                  categories:
                      - sc_impact
                  position: 2
                  rank: 2
                - id: SC_L
                  name: 'Subsequent System Confidentiality: Low'
                  definition: >-
                      Confidentiality on subsequent systems is partly lost: some restricted information is exposed, but the attacker
                      cannot choose which.
                  guidance: >-
                      Select when the attacker gains limited data access on systems beyond the vulnerable system, such as partial
                      leakage to downstream services.
                  views:
                      default: 'SC:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'SC:L'
                      - SC L
                  categories:
                      - sc_impact
                  position: 1
                  rank: 1
                - id: SC_N
                  name: 'Subsequent System Confidentiality: None'
                  definition: >-
                      Confidentiality on subsequent systems is unaffected.
                  guidance: Select when confidentiality of subsequent systems is not affected by the vulnerability.
                  views:
                      default: 'SC:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'SC:N'
                      - SC N
                  categories:
                      - sc_impact
                  position: 0
                  rank: 0
                - id: SI_H
                  name: 'Subsequent System Integrity: High'
                  definition: >-
                      Integrity on subsequent systems is lost entirely: any of their data can be altered.
                  guidance: Select when the attacker can modify all data on systems beyond the vulnerable system without restriction.
                  views:
                      default: 'SI:H'
                      metric: H
                      label: High
                  aliases:
                      - 'SI:H'
                      - SI H
                  categories:
                      - si_impact
                  position: 2
                  rank: 2
                - id: SI_L
                  name: 'Subsequent System Integrity: Low'
                  definition: >-
                      Integrity on subsequent systems is partly lost: data can be altered, but the extent or the effect of the change
                      is outside the attacker's control.
                  guidance: >-
                      Select when the attacker can make limited or uncontrolled modifications to data on systems beyond the vulnerable
                      system.
                  views:
                      default: 'SI:L'
                      metric: L
                      label: Low
                  aliases:
                      - 'SI:L'
                      - SI L
                  categories:
                      - si_impact
                  position: 1
                  rank: 1
                - id: SI_N
                  name: 'Subsequent System Integrity: None'
                  definition: >-
                      Integrity on subsequent systems is unaffected.
                  guidance: Select when integrity of subsequent systems is not affected by the vulnerability.
                  views:
                      default: 'SI:N'
                      metric: 'N'
                      label: None
                  aliases:
                      - 'SI:N'
                      - SI N
                  categories:
                      - si_impact
                  position: 0
                  rank: 0
                - id: SA_H
                  name: 'Subsequent System Availability: High'
                  definition: >-
                      Availability of subsequent systems is lost entirely: access to their resources can be denied outright.
                  guidance: Select when the attacker can completely deny service on systems beyond the vulnerable system.
                  views:
                      default: 'SA:H'
                      metric: H
                      label: High
                  aliases:
