scheme:
    id: cvss-v4
    version: 4.0.0
    name: CVSS v4.0
    description: >
        Common Vulnerability Scoring System (CVSS) version 4.0, released November 2023 by FIRST (Forum of Incident Response
        and Security Teams). Supersedes CVSS v3.1. Introduces Base, Threat (formerly Temporal), Environmental, and
        Supplemental metric groups. New victim system metrics (VC/VI/VA for the vulnerable system; SC/SI/SA for subsequent
        systems) and new Supplemental group metrics. Scoring nomenclature: CVSS-B (base only), CVSS-BT (base+threat),
        CVSS-BE (base+environmental), CVSS-BTE (base+threat+environmental). Supplemental metrics do not affect the score.
    definition: >-
        CVSS v4.0 describes a vulnerability through four metric groups: Base, Threat, Environmental, and Supplemental. Only
        Base, Threat, and Environmental contribute to the score. The Base
        group holds the properties that do not change with time or deployment, scored against the reasonable worst case across
        environments.
    guidance: >-
        The vector string is the transport form of an assessment: one value per metric, in a fixed order, short enough to paste
        into a ticket and machine readable on the other end. Source: FIRST CVSS v4.0 Specification Document,
        https://www.first.org/cvss/v4.0/specification-document.
