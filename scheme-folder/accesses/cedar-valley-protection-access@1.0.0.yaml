access:
  id: cedar-valley-protection-access
  version: 1.0.0
  name: "Cedar Valley: Protection Access"
  description: >-
    Checks a trusted host-provided clearance against the marked protection level. PUBLIC needs no clearance. Clearance is only one gate; a deployment remains responsible for identity, purpose, and record relationships.
  target_scheme:
    id: cedar-valley-protection
    version: "*"
  rules:
    - id: protection-clearance
      name: Protection clearance
      attribute: clearance
      category: level
      strategy: gte
      when:
        data:
          category: level
          operator: min_order
          value: 1
      deny_reason: The reader’s trusted clearance is below this protection level.
