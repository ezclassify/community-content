access:
  id: cedar-valley-handling-access
  version: 1.0.0
  name: "Cedar Valley: Protection and Handling Access"
  description: >-
    Checks a trusted host-provided clearance against the marked protection level. Handling markings are human instructions and do not independently grant or deny access.
  target_scheme:
    id: cedar-valley-handling
    version: "*"
  rules:
    - id: protection-clearance
      name: Protection clearance
      attribute: clearance
      category: level
      strategy: gte
      when:
        data:
          category: level
          operator: min_rank
          value: 1
      deny_reason: The reader’s trusted clearance is below this protection level.
