access:
  id: cedar-valley-access
  version: 1.0.0
  name: Cedar Valley District Files Access
  description: >-
    Checks trusted host-provided clearance, sensitive-content permissions, school eligibility, and recipient organization. Cedar Valley District is derived for every nonpublic file; selected external organizations are additional allowed recipients. The host supplies identity, record relationships, assignments, and delivery facts.
  target_scheme:
    id: cedar-valley
    version: "*"
  rules:
    - id: protection-clearance
      name: Protection clearance
      attribute: clearance
      category: level
      strategy: gte
      when:
        data:
          category: level
          operator: min_order
          value: 1
      deny_reason: The reader’s trusted clearance is below this protection level.
    - id: sensitive-content-permissions
      name: Sensitive content permissions
      attribute: sensitive_content_permissions
      category: sensitive_content
      strategy: superset
      deny_reason: The reader lacks permission for one or more sensitive-content kinds.
    - id: permitted-school
      name: Permitted school
      attribute: school_memberships
      category: permitted_schools
      strategy: includes
      deny_reason: None of the reader’s trusted school memberships is permitted.
    - id: recipient-organization
      name: Recipient organization
      attribute: recipient_organizations
      category: allow_sharing_with
      strategy: includes
      deny_reason: The reader’s trusted recipient organization is not permitted.
