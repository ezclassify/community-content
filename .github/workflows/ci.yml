name: CI

# One required check: the job below, named "ci". The "full" job adds the
# release-only proofs and runs only from a manual dispatch with full=true.
on:
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            full:
                description: Also run the release-only proofs (Node matrix, pack and consume)
                type: boolean
                default: false

permissions:
    contents: read
    packages: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: ezclassify/.github/actions/setup-node-npm@a42ece80f520858a2926723d12bba2af2dca0474
              with:
                  node-version: '22'

            # These two read only the tree and need no installed dependencies.
            - name: CLI pin is well-formed
              # Licensed maintainers may resolve a CLI locally. Its optional pin
              # must name a checksummed artifact or no source; this public job never
              # downloads the proprietary engine or runs behavioral suites.
              run: npm run check:cli-pin

            - name: No dependency or import escapes the repo
              # No file:/link:/workspace: dependency protocols in the published
              # manifest, and no relative import that resolves above the repo root.
              run: npm run check:no-escape

            - name: Configure registry for CI
              # Registry config lives in a user-level npmrc so the tracked project
              # .npmrc (ignore-scripts) stays untouched and the clean-tree check
              # below stays honest. Same-repository runs use the scoped Actions
              # package reader; fork pull requests resolve @ezclassify from the
              # public registry with no credential.
              env:
                  EZ_GHPKG_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.EZ_GHPKG_TOKEN || github.token) || '' }}
              run: |
                  set -euo pipefail
                  if [ -n "$EZ_GHPKG_TOKEN" ]; then
                    cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
                  @ezclassify:registry=https://npm.pkg.github.com
                  //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
                  NPMRC
                    echo "Resolving @ezclassify from GitHub Packages."
                  else
                    echo '@ezclassify:registry=https://registry.npmjs.org' > "$RUNNER_TEMP/ci-npmrc"
                    echo "Resolving @ezclassify from public npm, no credential."
                  fi
                  echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

            - name: Install
              env:
                  NODE_AUTH_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.EZ_GHPKG_TOKEN || github.token) || '' }}
              uses: ezclassify/.github/actions/install-node-dependencies@a42ece80f520858a2926723d12bba2af2dca0474
              with:
                  mode: generated
                  relock-installs: 'false'

            - name: Dependency license compliance
              run: npm run check:dependency-licenses

            - name: THIRD-PARTY-NOTICES.md matches the production dependency set
              # Adding a production dependency forces the attribution (and a
              # license review) into the same PR.
              run: npm run notices && git diff --exit-code THIRD-PARTY-NOTICES.md

            # Lint, format and typecheck cover the code around the scheme data.
            # Scheme YAML and the compiled bundle are owned by the `fmt` verb and
            # excluded (.prettierignore, eslint.config.mjs).
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck

            - run: npm test

            - run: npm run validate

            - run: npm run build

            - name: README quickstart runs against the built bundle
              run: node scripts/readme-quickstart.mjs

            - name: Manifest is in sync (npm run fmt is a no-op)
              run: npm run fmt

            - name: Working tree is clean after build
              run: git diff --exit-code && test -z "$(git status --porcelain)"

    full:
        name: full
        if: ${{ inputs.full }}
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                node-version: ['22', '24']
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: ezclassify/.github/actions/setup-node-npm@a42ece80f520858a2926723d12bba2af2dca0474
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Configure registry for CI
              env:
                  EZ_GHPKG_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
              run: |
                  set -euo pipefail
                  cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
                  @ezclassify:registry=https://npm.pkg.github.com
                  //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
                  NPMRC
                  echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

            - name: Install
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
              uses: ezclassify/.github/actions/install-node-dependencies@a42ece80f520858a2926723d12bba2af2dca0474
              with:
                  mode: generated
                  relock-installs: 'false'

            - run: npm test

            - run: npm run build

            - name: Pack and consume the package from its tarball
              # npm-pack @ezclassify/schemes, install the tarball into a scratch
              # project outside the repo, and resolve every declared export the
              # way a consumer would.
              run: npm run verify:pack-consume
